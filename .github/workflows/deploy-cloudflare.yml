name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  frontend:
    name: Deploy frontend to Cloudflare Pages
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Deploy Pages project
        run: npx wrangler@latest pages deploy dist --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" --branch main
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}

  worker:
    name: Deploy API proxy Worker
    runs-on: ubuntu-latest
    if: ${{ vars.CLOUDFLARE_WORKER_BACKEND_ORIGIN != '' && vars.CLOUDFLARE_WORKER_ALLOWED_ORIGIN != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Worker deployment config
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'deploy/cloudflare-api-proxy/wrangler.jsonc'
          const config = JSON.parse(fs.readFileSync(path, 'utf8'))

          config.vars = {
            BACKEND_ORIGIN: process.env.BACKEND_ORIGIN,
            ALLOWED_ORIGIN: process.env.ALLOWED_ORIGIN,
          }

          fs.writeFileSync(
            'deploy/cloudflare-api-proxy/wrangler.generated.jsonc',
            `${JSON.stringify(config, null, 2)}\n`,
          )
          NODE
        env:
          BACKEND_ORIGIN: ${{ vars.CLOUDFLARE_WORKER_BACKEND_ORIGIN }}
          ALLOWED_ORIGIN: ${{ vars.CLOUDFLARE_WORKER_ALLOWED_ORIGIN }}

      - name: Deploy Worker
        run: npx wrangler@latest deploy --config deploy/cloudflare-api-proxy/wrangler.generated.jsonc
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
